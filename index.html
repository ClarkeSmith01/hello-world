<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e8e8e8">
<title>ARCHIE</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#e8e8e8}canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
</style>
</head>
<body>
<canvas id="field" tabindex="0" role="img" aria-label="A full-screen field of vertical ASCII lines. Move your mouse to spin them and reveal ARCHIE. Press Escape to reset; Space also spins the field."></canvas>
<span id="status" class="sr" aria-live="polite">Move to spin.</span>
<script>
'use strict';
const TAU=Math.PI*2,STEP=1/120;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
// Independent inertial rotors, coupled to their four immediate neighbors.
// Simulation uses a fixed timestep so damping and capture do not depend on FPS.
class RotorField {
 constructor(cells,cols,rows){this.cells=cells;this.cols=cols;this.rows=rows;this.forces=new Float64Array(cells.length)}
 impulse(ax,ay,bx,by,seconds,radius){
  const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy);if(len<.1)return;
  const speed=Math.min(2400,len/Math.max(seconds,1/240)),nx=dx/len,ny=dy/len;
  for(const c of this.cells){
   if(c.locked)continue;
   const t=clamp(((c.x-ax)*dx+(c.y-ay)*dy)/(len*len),0,1);
   const rx=c.x-(ax+dx*t),ry=c.y-(ay+dy*t),r=Math.hypot(rx,ry);
   if(r>=radius)continue;
   const falloff=(1-r/radius)**2;
   // Tangential drag produces opposite rotation on opposite sides of the wake.
   const tangent=(nx*ry-ny*rx)/radius;
   const drag=nx*.42-ny*.24+tangent*1.8;
   c.velocity=clamp(c.velocity+drag*falloff*len*.18*(.55+speed/1600),-26,26);
  }
 }
 step(dt){
  const cells=this.cells,cols=this.cols;let active=false;
  for(let i=0;i<cells.length;i++){
   const c=cells[i];let torque=0;
   if(c.locked){torque=75*wrap(c.target-c.angle)-13*c.velocity}
   else{
    // Periodic torsion springs allow complete revolutions without winding up.
    const neighbors=[i%cols?i-1:-1,i%cols<cols-1?i+1:-1,i>=cols?i-cols:-1,i+cols<cells.length?i+cols:-1];
    for(const j of neighbors)if(j>=0)torque+=24*Math.sin(2*(cells[j].angle-c.angle));
    torque-=1.8*Math.sin(2*c.angle)+1.65*c.velocity;
   }
   this.forces[i]=torque;
  }
  for(let i=0;i<cells.length;i++){
   const c=cells[i];c.velocity+=this.forces[i]*dt;c.angle+=c.velocity*dt;
   c.travel+=Math.abs(c.velocity)*dt;
   if(c.ink&&!c.locked&&c.travel>.75){
    c.locked=true;c.target=Math.round((c.angle+c.velocity*.10)/Math.PI)*Math.PI;
   }
   if(c.locked){
    const ready=1-clamp(Math.abs(wrap(c.target-c.angle))/.7,0,1);
    c.shade+=(ready-c.shade)*(1-Math.exp(-dt*7));
    if(Math.abs(c.velocity)<.008&&Math.abs(wrap(c.target-c.angle))<.002){c.angle=c.target;c.velocity=0}
   }
   if(Math.abs(c.velocity)>.004||Math.abs(Math.sin(2*c.angle))>.004||(c.locked&&c.shade<.999))active=true;
  }
  return active;
 }
}
const canvas=document.getElementById('field'),ctx=canvas.getContext('2d',{alpha:false}),status=document.getElementById('status');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let w=0,h=0,dpr=1,glyphs=[],field,raf=0,last=0,accumulator=0,announced=false;
let pointer=null;
function resize(){
 w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
 const gapX=Math.max(4,Math.min(12,w/120)),gapY=gapX*1.5,glyphSize=gapY*1.055;
 const cols=Math.ceil(w/gapX),rows=Math.ceil(h/gapY);
 glyphs=Array.from({length:128},(_,i)=>{
  const image=document.createElement('canvas'),side=Math.ceil(glyphSize*1.8);image.width=image.height=Math.ceil(side*dpr);
  const g=image.getContext('2d');g.scale(dpr,dpr);g.translate(side/2,side/2);g.rotate(i*TAU/128);
  g.font=`bold ${glyphSize}px "Courier New", monospace`;g.textAlign='center';g.textBaseline='middle';g.fillText('|',0,0);return{image,side};
 });
 const mask=document.createElement('canvas');mask.width=w;mask.height=h;const m=mask.getContext('2d',{willReadFrequently:true});
 let size=Math.min(h*.34,w*.215);m.font=`900 ${size}px Arial, sans-serif`;size*=Math.min(1,w*.86/m.measureText('ARCHIE').width);
 m.font=`900 ${size}px Arial, sans-serif`;m.textAlign='center';m.textBaseline='middle';m.fillText('ARCHIE',w/2,h/2+size*.035);
 const p=m.getImageData(0,0,w,h).data,cells=[];
 for(let row=0;row<rows;row++)for(let col=0;col<cols;col++){
  const x=col*gapX+gapX/2,y=row*gapY+gapY/2;
  const ink=p[(Math.min(h-1,Math.floor(y))*w+Math.min(w-1,Math.floor(x)))*4+3]>100;
  cells.push({x,y,ink,angle:0,velocity:0,travel:0,locked:false,target:0,shade:0});
 }
 field=new RotorField(cells,cols,rows);pointer=null;announced=false;requestFrame();
}
function requestFrame(){if(!raf){last=0;accumulator=0;raf=requestAnimationFrame(tick)}}
function paint(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalAlpha=1;ctx.fillStyle='#e8e8e8';ctx.fillRect(0,0,w,h);
 let settled=0,total=0;
 for(const c of field.cells){
  const phase=((c.angle%TAU)+TAU)%TAU;
  const g=glyphs[Math.round(phase/TAU*128)%128];
  ctx.globalAlpha=.30+c.shade*.62;ctx.drawImage(g.image,c.x-g.side/2,c.y-g.side/2,g.side,g.side);
  if(c.ink){total++;if(c.locked&&c.shade>.98)settled++}
 }
 canvas.dataset.locked=String(settled);canvas.dataset.letters=String(total);
 if(total&&settled/total>.96&&!announced){announced=true;status.textContent='ARCHIE is locked. The surrounding lines still respond to your mouse.'}
}
function tick(now){
 raf=0;accumulator+=last?Math.min((now-last)/1000,.08):STEP;last=now;let active=false;
 while(accumulator>=STEP){active=field.step(STEP)||active;accumulator-=STEP}
 paint();
 if(active)raf=requestAnimationFrame(tick);else{last=0;accumulator=0}
}
function move(e){
 const next={x:e.clientX,y:e.clientY,time:e.timeStamp};
 if(pointer){
  field.impulse(pointer.x,pointer.y,next.x,next.y,Math.max(.001,(next.time-pointer.time)/1000),Math.max(65,Math.min(w,h)*.19)*(reduced?.7:1));
  requestFrame();
 }
 pointer=next;
}
function reset(){for(const c of field.cells){c.angle=c.velocity=c.travel=c.target=c.shade=0;c.locked=false}pointer=null;announced=false;status.textContent='Move to spin.';requestFrame()}
canvas.addEventListener('pointermove',move);
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointer={x:e.clientX,y:e.clientY,time:e.timeStamp}});
canvas.addEventListener('pointerleave',()=>{pointer=null});
canvas.addEventListener('pointercancel',()=>{pointer=null});
canvas.addEventListener('dblclick',reset);
addEventListener('keydown',e=>{
 if(e.key==='Escape')reset();
 if(e.key===' '||e.key.startsWith('Arrow')){e.preventDefault();const backwards=['ArrowLeft','ArrowDown'].includes(e.key);field.impulse(backwards?w:0,h/2,backwards?0:w,h/2,.35,Math.max(80,h*.2));requestFrame()}
});
addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0;last=0}else requestFrame()});
resize();
</script>
</body>
</html>
