<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e8e8e8">
<title>ARCHIE</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#e8e8e8}canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
</style>
</head>
<body>
<canvas id="field" tabindex="0" role="img" aria-label="A full-screen field of vertical ASCII lines. Move your mouse to spin them and reveal ARCHIE. Press Escape to reset; Space also spins the field."></canvas>
<span id="status" class="sr" aria-live="polite">Move to spin.</span>
<script>
'use strict';
const canvas=document.getElementById('field'),ctx=canvas.getContext('2d',{alpha:false});
const status=document.getElementById('status');
const TAU=Math.PI*2,reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let w=0,h=0,dpr=1,glyphSize=19,glyphs=[],cells=[],progress=0,energy=0,raf=0,last=0,announced=false;
let pointer={x:-1000,y:-1000,previousX:null,previousY:null};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=x=>x*x*(3-2*x);
function resize(){
 w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 const gapX=Math.max(4,Math.min(12,w/120)),gapY=gapX*1.5;glyphSize=gapY*1.055;
 const columns=Math.ceil(w/gapX),rows=Math.ceil(h/gapY);
 glyphs=Array.from({length:64},(_,i)=>{
  const g=document.createElement('canvas'),side=Math.ceil(glyphSize*1.8);g.width=g.height=Math.ceil(side*dpr);
  const gc=g.getContext('2d');gc.scale(dpr,dpr);gc.translate(side/2,side/2);gc.rotate(i*TAU/64);
  gc.font=`bold ${glyphSize}px "Courier New", monospace`;gc.textAlign='center';gc.textBaseline='middle';gc.fillText('|',0,0);
  return {image:g,side};
 });
 const mask=document.createElement('canvas');mask.width=w;mask.height=h;
 const m=mask.getContext('2d',{willReadFrequently:true});
 let fontSize=Math.min(h*.34,w*.215);m.font=`900 ${fontSize}px Arial, sans-serif`;
 fontSize*=Math.min(1,w*.86/m.measureText('ARCHIE').width);
 m.font=`900 ${fontSize}px Arial, sans-serif`;m.textAlign='center';m.textBaseline='middle';
 m.fillText('ARCHIE',w/2,h/2+fontSize*.035);
 const pixels=m.getImageData(0,0,w,h).data;
 cells=[];
 for(let row=0;row<rows;row++)for(let col=0;col<columns;col++){
  const x=col*gapX+gapX/2,y=row*gapY+gapY/2;
  const px=Math.min(w-1,Math.floor(x)),py=Math.min(h-1,Math.floor(y));
  const ink=pixels[(py*w+px)*4+3]>100;
  const seed=((col*73+row*137)%101)/101;
  cells.push({x,y,ink,angle:0,velocity:0,lock:null,settled:false,shade:0,threshold:.12+.57*(x/w)+seed*.12,seed,length:gapY*.72});
 }
 requestFrame();
}
function requestFrame(){if(!raf){last=0;raf=requestAnimationFrame(tick)}}
function stimulate(x,y,travel){
 pointer.x=x;pointer.y=y;
 const force=clamp(travel/24,.15,2.5);
 energy=Math.min(2.2,energy+force*.24);
 progress=Math.min(1,progress+travel/Math.max(360,w*.85));
 const radius=Math.max(100,Math.min(w,h)*.22),radius2=radius*radius;
 for(const c of cells){
  if(c.lock!==null)continue;
  const dx=c.x-x,dy=c.y-y,d2=dx*dx+dy*dy;
  // Every mark responds; nearby marks turn faster, carrying a ripple through the field.
  const near=Math.max(0,1-d2/radius2);
  c.velocity=Math.min(18,c.velocity+force*(.32+near*5));
 }
 requestFrame();
}
function move(e){
 const x=e.clientX,y=e.clientY;
 const distance=pointer.previousX===null?14:Math.hypot(x-pointer.previousX,y-pointer.previousY);
 pointer.previousX=x;pointer.previousY=y;
 if(distance>.1)stimulate(x,y,Math.min(distance,100));
}
function reset(){
 progress=0;energy=0;announced=false;pointer.previousX=pointer.previousY=null;
 for(const c of cells){c.angle=0;c.velocity=0;c.lock=null;c.settled=false;c.shade=0}
 status.textContent='Move to spin.';requestFrame();
}
function tick(now){
 raf=0;const dt=last?Math.min((now-last)/1000,.04):1/60;last=now;
 energy*=Math.exp(-dt*2.2);
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalAlpha=1;ctx.fillStyle='#e8e8e8';ctx.fillRect(0,0,w,h);
 ctx.font=`${glyphSize}px "Courier New", monospace`;ctx.textAlign='center';ctx.textBaseline='middle';
 let active=false,locked=0,total=0;
 for(const c of cells){
  if(c.ink){
   total++;
   if(c.lock===null&&progress>=c.threshold){
    // Finish a turn, then latch upright. Locked letters ignore later mouse movement.
    c.lock=(Math.floor(c.angle/Math.PI)+1)*Math.PI;
   }
  }
  if(c.lock!==null){
   const remaining=c.lock-c.angle;
   c.angle+=remaining*(1-Math.exp(-dt*(reduced?12:5.4)));
   c.shade+=(1-c.shade)*(1-Math.exp(-dt*5));
   c.velocity=0;
   if(Math.abs(remaining)<.003){c.angle=c.lock;c.settled=true;locked++}else active=true;
   if(c.shade<.999)active=true;
  }else{
   c.angle+=c.velocity*dt*(reduced?.22:1);
   c.velocity*=Math.exp(-dt*2.1);
   if(c.velocity>.006)active=true;else c.velocity=0;
  }
  // The lettering is made from the same ASCII pipes as the surrounding field.
  const background=116+progress*65;
  const shade=Math.round(background*(1-c.shade)+24*c.shade);
  const glyph=glyphs[Math.round((c.angle%TAU)/TAU*64)%64];
  ctx.globalAlpha=(232-shade)/232;ctx.drawImage(glyph.image,c.x-glyph.side/2,c.y-glyph.side/2,glyph.side,glyph.side);
 }
 if(total&&locked===total&&!announced){announced=true;status.textContent='ARCHIE. Move to keep the surrounding lines spinning. Escape resets.'}
 if(active||energy>.003)raf=requestAnimationFrame(tick);else last=0;
}
canvas.addEventListener('pointermove',move);
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);move(e)});
canvas.addEventListener('pointerleave',()=>{pointer.previousX=pointer.previousY=null});
canvas.addEventListener('dblclick',reset);
addEventListener('keydown',e=>{
 if(e.key==='Escape')reset();
 if(e.key===' '||e.key.startsWith('Arrow')){e.preventDefault();stimulate(w/2,h/2,w*.15)}
});
addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0;last=0}else requestFrame()});
resize();
</script>
</body>
</html>
